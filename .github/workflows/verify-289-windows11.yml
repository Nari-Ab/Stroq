name: Verify the Stroq card on Windows 11
on:
  push:
    branches: [codex/verify-289-windows11]

permissions:
  contents: read

jobs:
  desktop:
    if: github.repository == 'Nari-Ab/Stroq'
    runs-on: windows-11-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Exercise the published CLI in a Windows PowerShell console
        shell: pwsh
        run: ./tools/diagnostics/verify-windows-card.ps1
