name: Verify PR 309 on Windows
on:
  push:
    branches: [codex/verify-309-windows]
permissions:
  contents: read
jobs:
  windows:
    if: github.repository == 'Nari-Ab/Stroq'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a97992a1f55fbde4840a9482d0ad517ddd9c5826
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        id: python
        with:
          python-version: '3.12'
      - name: Verify the checkout
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne 'a97992a1f55fbde4840a9482d0ad517ddd9c5826') { throw "Unexpected commit $actual" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          STROQ_PYTHON: ${{ steps.python.outputs.python-path }}
